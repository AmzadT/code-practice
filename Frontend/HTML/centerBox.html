    <style>
        #cont {
            position: relative;
            border: 5px solid orangered;
            height: 100vh;
        }

        .box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid teal;
            height: 300px;
            width: 300px;
            display: grid;
            place-items: center;
        }
    </style>
</head>
