<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button center</title>

    <style>
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            border: 5px solid black;
        }

        button{
            padding: 10px 20px;
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">
        <button>Click Me!</button>
    </div>
</body>
</html>
